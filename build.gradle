plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'com.modrinth.minotaur' version '2.10.0'
}

base {
	archivesName = 'railway'
}

repositories {
	mavenCentral()
}

loom {
	serverOnlyMinecraftJar()
	runs {
		fixtureServer {
			server()
			name = "Fixture Server"
			runDir = "run/fixture-kill9"
		}
	}
}

// Build metadata consumed by the dev-only fixture reports. Production code
// ignores it unless the fixture surface is enabled.
def buildInfoDir = layout.buildDirectory.dir('generated/build-info')
def generateBuildInfo = tasks.register('generateBuildInfo') {
	def outputDir = buildInfoDir
	def projectPath = projectDir
	def projectVersion = project.version.toString()
	outputs.dir(outputDir)
	// git HEAD can change without any tracked input changing; refresh every build.
	outputs.upToDateWhen { false }
	doLast {
		String commit = 'unknown'
		try {
			Process process = new ProcessBuilder('git', 'rev-parse', 'HEAD')
					.directory(projectPath)
					.redirectErrorStream(true)
					.start()
			String text = process.inputStream.getText('UTF-8').trim()
			if (process.waitFor() == 0 && !text.isEmpty()) {
				commit = text
			}
		} catch (Exception ignored) {
			// A source archive without .git still builds; the report says unknown.
		}
		File output = outputDir.get().file('railway-build.properties').asFile
		output.parentFile.mkdirs()
		output.text = "version=${projectVersion}\ncommit=${commit}\n"
	}
}
sourceSets.main.resources.srcDir(buildInfoDir)
tasks.named('processResources') {
	dependsOn generateBuildInfo
}
// The generated metadata is part of main resources, so the source jar sees the
// same directory. Declare the dependency instead of relying on task order.
tasks.matching { it.name == 'sourcesJar' }.configureEach {
	dependsOn generateBuildInfo
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	testImplementation "org.junit.jupiter:junit-jupiter:${project.junit_version}"
	testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

processResources {
	def version = project.version
	inputs.property 'version', version

	filesMatching('fabric.mod.json') {
		expand 'version': version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

tasks.named('test') {
	useJUnitPlatform()
}

fabricApi {
	configureTests {
		createSourceSet = true
		modId = "railway-gametest"
		enableGameTests = true
		enableClientGameTests = false
		eula = true
	}
}

// GameTests add stations to world state and Railway saves it on shutdown. A
// reused run directory would make the next run start with every old test
// station, so each GameTest run starts from a fresh Railway state.
tasks.named('runGameTest') {
	def stateFile = layout.buildDirectory.file('run/gameTest/world/railway/state.json').get().asFile
	doFirst {
		if (stateFile.isFile()) {
			stateFile.delete()
		}
	}
}

// Modrinth displays one version's changelog. Extract only that version's section
// from the repository CHANGELOG instead of uploading the whole history.
def changelogForVersion = { String version ->
	def file = rootProject.file('CHANGELOG.md')
	if (!file.exists()) {
		return "Railway ${version}"
	}
	def lines = file.readLines('UTF-8')
	int start = -1
	for (int i = 0; i < lines.size(); i++) {
		String line = lines[i].trim()
		if (!line.startsWith('## ')) {
			continue
		}
		String heading = line.substring(3).trim()
		String headingVersion = heading.split('\\s+', 2)[0]
		if (headingVersion == version) {
			start = i
			break
		}
	}
	if (start < 0) {
		return "Railway ${version}"
	}
	int end = lines.size()
	for (int i = start + 1; i < lines.size(); i++) {
		if (lines[i].trim().startsWith('## ')) {
			end = i
			break
		}
	}
	String body = lines.subList(start + 1, end).join('\n').trim()
	return body.isEmpty() ? "Railway ${version}" : body
}

def printChangelogVersion = project.version.toString()
def printChangelogText = changelogForVersion(printChangelogVersion)
tasks.register('printModrinthChangelog') {
	doLast {
		println printChangelogText
	}
}

// Modrinth publishing. `./gradlew modrinth` uploads the remapped release jar.
// Requires MODRINTH_TOKEN and MODRINTH_PROJECT_ID. The release workflow supplies
// both; local builds do not need them.
modrinth {
	token = System.getenv('MODRINTH_TOKEN')
	projectId = System.getenv('MODRINTH_PROJECT_ID') ?: ''
	versionNumber = project.version.toString()
	versionName = "Railway ${project.version}"
	versionType = project.findProperty('modrinthVersionType') ?: 'alpha'
	changelog = changelogForVersion(project.version.toString())
	syncBodyFrom = rootProject.file('docs/modrinth-description.md').getText('UTF-8')
	uploadFile = tasks.named('jar')
	gameVersions = [project.minecraft_version.toString()]
	loaders = ['fabric']
	environment = 'server_only'
	dependencies {
		required.project 'fabric-api'
	}
}


// Minotaur resolves project/upload state during execution and is not compatible
// with Gradle's configuration cache.
tasks.matching { it.name == 'modrinth' || it.name == 'modrinthSyncBody' }.configureEach {
	notCompatibleWithConfigurationCache('Minotaur reads project state during execution')
}
