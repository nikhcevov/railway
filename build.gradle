plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

base {
	archivesName = 'railway'
}

repositories {
	mavenCentral()
}

loom {
	serverOnlyMinecraftJar()
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	testImplementation "org.junit.jupiter:junit-jupiter:${project.junit_version}"
	testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

processResources {
	def version = project.version
	inputs.property 'version', version

	filesMatching('fabric.mod.json') {
		expand 'version': version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

tasks.named('test') {
	useJUnitPlatform()
}

fabricApi {
	configureTests {
		createSourceSet = true
		modId = "railway-gametest"
		enableGameTests = true
		enableClientGameTests = false
		eula = true
	}
}

// GameTests add stations to world state and Railway saves it on shutdown. A
// reused run directory would make the next run start with every old test
// station, so each GameTest run starts from a fresh Railway state.
tasks.named('runGameTest') {
	def stateFile = layout.buildDirectory.file('run/gameTest/world/railway/state.json').get().asFile
	doFirst {
		if (stateFile.isFile()) {
			stateFile.delete()
		}
	}
}
