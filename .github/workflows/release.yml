name: release

# Change `version=` in gradle.properties and push to main.
# The workflow builds/tests, checks whether that version already exists on
# Modrinth, publishes it if needed, and creates the matching v<version> tag.
#
# A tag is created only after the Modrinth upload succeeds. If the upload
# succeeded but the tag push failed, a re-run skips the existing Modrinth
# version and just creates the tag.
on:
  push:
    branches:
      - main
    paths:
      - 'gradle.properties'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: railway-modrinth-release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Resolve version and release state
        id: meta
        shell: bash
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          MODRINTH_PROJECT_ID: ${{ vars.MODRINTH_PROJECT_ID }}
        run: |
          set -euo pipefail

          VERSION="$(sed -n 's/^version=//p' gradle.properties | head -n1)"
          if [ -z "$VERSION" ]; then
            echo "gradle.properties has no version=" >&2
            exit 1
          fi
          if ! [[ "$VERSION" =~ ^[0-9A-Za-z._-]+$ ]]; then
            echo "Unsafe version string: $VERSION" >&2
            exit 1
          fi

          case "$VERSION" in
            *-alpha*) CHANNEL=alpha ;;
            *-beta*) CHANNEL=beta ;;
            *) CHANNEL=release ;;
          esac

          git fetch --tags --force >/dev/null 2>&1 || true
          if git rev-parse -q --verify "refs/tags/v${VERSION}" >/dev/null; then
            TAG_EXISTS=true
          else
            TAG_EXISTS=false
          fi

          if [ -z "${MODRINTH_TOKEN:-}" ] || [ -z "${MODRINTH_PROJECT_ID:-}" ]; then
            echo "MODRINTH_TOKEN secret and MODRINTH_PROJECT_ID variable are required" >&2
            exit 1
          fi

          MODRINTH_EXISTS=false
          if curl -fsSL \
              -H 'User-Agent: railway-github-release' \
              "https://api.modrinth.com/v2/project/${MODRINTH_PROJECT_ID}/version" \
              -o /tmp/railway-modrinth-versions.json; then
            if jq -e --arg v "$VERSION" 'any(.[]; .version_number == $v)' \
                /tmp/railway-modrinth-versions.json >/dev/null; then
              MODRINTH_EXISTS=true
            fi
          else
            echo "Cannot read Modrinth project ${MODRINTH_PROJECT_ID}" >&2
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "channel=$CHANNEL" >> "$GITHUB_OUTPUT"
          echo "tag_exists=$TAG_EXISTS" >> "$GITHUB_OUTPUT"
          echo "modrinth_exists=$MODRINTH_EXISTS" >> "$GITHUB_OUTPUT"
          echo "Version $VERSION channel $CHANNEL tag=$TAG_EXISTS modrinth=$MODRINTH_EXISTS"

      - name: Build and test
        if: steps.meta.outputs.modrinth_exists != 'true'
        run: >-
          ./gradlew clean build runGameTest --stacktrace
          -Pversion=${{ steps.meta.outputs.version }}

      - name: Publish to Modrinth
        if: steps.meta.outputs.modrinth_exists != 'true'
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          MODRINTH_PROJECT_ID: ${{ vars.MODRINTH_PROJECT_ID }}
        run: >-
          ./gradlew modrinth --stacktrace
          -Pversion=${{ steps.meta.outputs.version }}
          -PmodrinthVersionType=${{ steps.meta.outputs.channel }}

      - name: Create and push tag
        if: steps.meta.outputs.tag_exists != 'true'
        shell: bash
        run: |
          set -euo pipefail
          VERSION='${{ steps.meta.outputs.version }}'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git tag -a "v${VERSION}" -m "Railway ${VERSION}"
          git push origin "v${VERSION}"

      - name: Upload release jar
        if: steps.meta.outputs.modrinth_exists != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: railway-${{ steps.meta.outputs.version }}
          path: build/libs/railway-*.jar
          if-no-files-found: error
          retention-days: 14
