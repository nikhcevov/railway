name: release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version without a leading v, for example 0.1.0-alpha.1
        required: false
        type: string
      channel:
        description: Modrinth version channel
        required: true
        default: alpha
        type: choice
        options:
          - alpha
          - beta
          - release
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Resolve version and channel
        id: release
        shell: bash
        run: |
          set -euo pipefail
          INPUT_VERSION='${{ github.event.inputs.version }}'
          if [ -n "$INPUT_VERSION" ]; then
            VERSION="$INPUT_VERSION"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          if [ -z "$VERSION" ]; then
            echo "No version supplied and no v* tag found." >&2
            exit 1
          fi
          CHANNEL='${{ github.event.inputs.channel }}'
          if [ -z "$CHANNEL" ]; then
            CHANNEL=alpha
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "channel=$CHANNEL" >> "$GITHUB_OUTPUT"
          echo "Releasing $VERSION as $CHANNEL"

      - name: Build and test
        run: >-
          ./gradlew build runGameTest --stacktrace
          -Pversion=${{ steps.release.outputs.version }}

      - name: Publish to Modrinth
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          MODRINTH_PROJECT_ID: ${{ vars.MODRINTH_PROJECT_ID }}
        run: >-
          ./gradlew modrinth --stacktrace
          -Pversion=${{ steps.release.outputs.version }}
          -PmodrinthVersionType=${{ steps.release.outputs.channel }}

      - name: Upload release jar
        uses: actions/upload-artifact@v4
        with:
          name: railway-${{ steps.release.outputs.version }}
          path: build/libs/railway-*.jar
          if-no-files-found: error
