name: build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Unit tests and jar
        run: ./gradlew build --stacktrace

      - name: Fabric GameTests
        run: ./gradlew runGameTest --stacktrace

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: railway-alpha-jar
          path: build/libs/railway-*.jar
          if-no-files-found: error
